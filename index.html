<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones, and tablets held upright: the 390px phone layout, scaled to fit.
         Tablets turned sideways: real width, so they get the web layout (900px and up). Desktop browsers ignore this tag. -->
    <meta name="viewport" content="width=390" id="viewport" />
    <script>
      if (Math.min(screen.width, screen.height) >= 700) {
        var land = matchMedia('(orientation: landscape)');
        var fit = function () { document.getElementById('viewport').content = land.matches ? 'width=device-width, initial-scale=1' : 'width=390'; };
        fit();
        land.addEventListener('change', fit);
      }
    </script>
    <!-- Each page's text is also written into the HTML for chatbots and search engines (build/staticCopy.js).
         Browsers that run the app never show it: this hides it before anything is drawn, and the app replaces it. -->
    <script>document.documentElement.classList.add('tn-js')</script>
    <style>.tn-js .tn-static{display:none}
      /* until the app draws (it replaces #root's contents), a quiet "TerraNotes" on the edition's paper, not a blank page */
      .tn-js #root:has(> .tn-static)::before,.tn-js #root:empty::before{content:"TerraNotes";position:fixed;inset:0;display:grid;place-items:center;
        background:var(--page,#F5F2E9);color:var(--ink,#18213A);font:italic 400 40px/1 'Instrument Serif',Georgia,serif;animation:tn-boot 1.4s ease-in-out infinite alternate}
      @keyframes tn-boot{from{opacity:.35}to{opacity:.9}}
      @media (prefers-reduced-motion: reduce){.tn-js #root::before{animation:none}}</style>
    <!-- the latest edition's colours and fonts as CSS variables, filled in from its look.js (vite.config.js) -->
    <style>%LOOK%</style>
    <meta name="theme-color" content="%THEME_COLOR%" />
    <meta name="description" content="Terranotes by Aquaterra: notes from where the land meets the water." />
    <title>Aquaterra</title>
    <!-- link previews; %SITE_URL% = the site's address, filled in at build (vite.config.js) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aquaterra" />
    <meta property="og:title" content="Aquaterra · TerraNotes" />
    <meta property="og:description" content="Terranotes by Aquaterra: notes from where the land meets the water." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og/home.jpg" />
    <meta property="og:image:secure_url" content="%SITE_URL%/og/home.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/og/home.jpg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="TerraNotes by Aquaterra" href="/feed.xml" />
    <!-- the fonts are the site's own (src/styles/fontfaces.css, files in public/fonts): no Google Fonts round trip -->
    %LOOK_FONTS%
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:340px;margin:60px auto;padding:22px;background:#fff;border:2px solid #111;box-shadow:8px 8px 0 #F0442B;font-family:Georgia,serif;color:#111">
        <strong>Aquaterra needs JavaScript.</strong><br />Turn it on in your browser settings to read TerraNotes: the articles, the photo wall and the words game all run on it.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
