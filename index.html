<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Phones, and tablets held upright: the 390px phone layout, scaled to fit.
         Tablets turned sideways: real width, so they get the web layout (900px and up). Desktop browsers ignore this tag. -->
    <meta name="viewport" content="width=390" id="viewport" />
    <script>
      if (Math.min(screen.width, screen.height) >= 700) {
        var land = matchMedia('(orientation: landscape)');
        var fit = function () { document.getElementById('viewport').content = land.matches ? 'width=device-width, initial-scale=1' : 'width=390'; };
        fit();
        land.addEventListener('change', fit);
      }
    </script>
    <!-- Each page's text is also written into the HTML for chatbots and search engines (build/static-html.js).
         Browsers that run the app never show it: this hides it before anything is drawn, and the app replaces it. -->
    <script>document.documentElement.classList.add('js')</script>
    <style>.js .static-copy{display:none}</style>
    <meta name="theme-color" content="#F3EEE4" />
    <meta name="description" content="Terranotes by Aquaterra: notes from where the land meets the water." />
    <title>Aquaterra</title>
    <!-- link previews; %SITE_URL% = the site's address, filled in at build (vite.config.js) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aquaterra" />
    <meta property="og:title" content="Aquaterra · TerraNotes" />
    <meta property="og:description" content="Terranotes by Aquaterra: notes from where the land meets the water." />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/opengraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="%SITE_URL%/opengraph.jpg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;700&family=Figtree:wght@400;500;600&family=Archivo+Black&family=Space+Mono:wght@400;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width:340px;margin:60px auto;padding:22px;background:#fff;border:2px solid #111;box-shadow:8px 8px 0 #F0442B;font-family:Georgia,serif;color:#111">
        <strong>Aquaterra needs JavaScript.</strong><br />Turn it on in your browser settings to read TerraNotes: the articles, the photo wall and the words game all run on it.
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
