<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fahhh</title>
<meta name="description" content="fahhh">
<style>
  /* A blank page with one word: "fahhh", in rainbow 3D, floating and turning slowly. The rest of the site lives on the
     fahhh branch. Everything here is CSS: the word is drawn twice, a solid extruded copy behind (stacked shadows) and a
     rainbow copy in front whose colours flow along the letters. Reduced motion: it stands still. */
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; overflow: hidden;
    background: #ffffff;
    font-family: "Arial Black", "Helvetica Neue", Impact, system-ui, sans-serif;
  }
  .stage { perspective: 900px; }
  .word {
    position: relative; display: inline-block; margin: 0;
    font-size: clamp(64px, 21vw, 320px); font-weight: 900; line-height: 1; letter-spacing: -0.02em;
    transform-style: preserve-3d;
    animation: sway 6s ease-in-out infinite;
  }
  /* the depth: the same word, solid, with a stack of shadows stepping back */
  .word::before {
    content: attr(data-text); position: absolute; inset: 0; z-index: 0;
    color: #3b2a7a;
    text-shadow:
      0.0032em 0.0032em 0 #3a2878, 0.0064em 0.0064em 0 #372676, 0.0096em 0.0096em 0 #342473, 0.0128em 0.0128em 0 #312271, 0.0160em 0.0160em 0 #2e206e,
      0.0192em 0.0192em 0 #2b1e6b, 0.0224em 0.0224em 0 #281c68, 0.0256em 0.0256em 0 #251a65, 0.0288em 0.0288em 0 #221862, 0.0320em 0.0320em 0 #1f165f,
      0.04em 0.045em 0.06em rgba(30, 20, 80, .35), 0.06em 0.08em 0.13em rgba(30, 20, 80, .2);
  }
  /* the face: rainbow, flowing */
  .word span {
    position: relative; z-index: 1; display: inline-block;
    background: linear-gradient(90deg, #ff2d55, #ff9500, #ffd60a, #34c759, #00c7be, #0a84ff, #5e5ce6, #bf5af2, #ff2d55);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: flow 4s linear infinite;
    filter: drop-shadow(0 0 0.5px rgba(255, 255, 255, .6));
  }
  @keyframes flow { to { background-position: 200% 0; } }
    @keyframes sway {
    0%, 100% { transform: rotateY(-14deg) rotateX(8deg) translateY(0); }
    50% { transform: rotateY(14deg) rotateX(-4deg) translateY(-3%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .word, .word span { animation: none !important; }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="word" data-text="fahhh" aria-label="fahhh"><span aria-hidden="true">fahhh</span></h1>
  </main>
</body>
</html>
