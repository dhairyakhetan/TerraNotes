# The visual regression test (playwright.config.js, tests/visual/) on every push and pull request to main: builds the
# site, screenshots the key pages at 390px and 1440px and compares them with tests/visual/screenshots/. On a
# difference the run fails and the "visual-report" artifact shows before / after / diff for each page.
# After a change you meant: run this workflow by hand (Actions → Visual test → Run workflow) with "update" ticked; it
# saves the new screenshots and commits them to the branch.
name: Visual test
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch:
    inputs:
      update: { description: 'Save new screenshots (after a change you meant)', type: boolean, default: false }
permissions:
  contents: write
jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Compare
        if: ${{ !inputs.update }}
        run: npx playwright test
        env: { CI: '1' }
      - name: Save new screenshots
        if: ${{ inputs.update }}
        run: |
          npx playwright test --update-snapshots
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/screenshots
          git diff --cached --quiet || (git commit -m "Visual test: new screenshots" && git push)
        env: { CI: '1' }
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: visual-report, path: playwright-report, retention-days: 14 }
