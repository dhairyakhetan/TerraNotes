# Rebuilds the own site soon after an edition goes live, so what's made at build time catches up with it: page titles
# and first colours, link previews, the sitemap, llms.txt. (The edition itself shows at its launch without this: each
# reader's page checks the time.) An edition's launch is in src/data/editions.js: by default 8 pm India time on the last
# day of its month, or its `live`. Every hour at :05 India time, tools/go-live-due.mjs asks whether one went live in the
# last 90 minutes; if so, this calls the Vercel deploy hook in the repository secret VERCEL_DEPLOY_HOOK (Vercel → the
# project → Settings → Git → Deploy Hooks, branch main; then GitHub → Settings → Secrets and variables → Actions).
# Run it by hand to rebuild now. AQ's website runs its own copy (embed/aq/scripts/terranotes-go-live.yml).
name: Go live
on:
  schedule:
    - cron: '35 * * * *' # every hour at :35 UTC = :05 India time
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Did an edition just go live?
        id: due
        run: node tools/go-live-due.mjs
      - name: Rebuild the site
        if: ${{ steps.due.outputs.due == 'yes' || github.event_name == 'workflow_dispatch' }}
        env: { HOOK: '${{ secrets.VERCEL_DEPLOY_HOOK }}' }
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::No VERCEL_DEPLOY_HOOK secret: the new edition shows anyway, but the build-time parts (link previews, sitemap) wait for the next deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "Rebuild started."
